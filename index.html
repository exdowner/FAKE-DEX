<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WebDEX</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Barra superior -->
  <header id="topbar">
    <div class="brand">⚡ WebDEX</div>
    <input id="search" placeholder="Buscar apps..." />
    <div class="clock" id="clock"></div>
  </header>

  <!-- Área de apps (grid) -->
  <main id="desktop">
    <div id="app-grid"></div>
  </main>

  <!-- Área de janelas (apps abertos) -->
  <div id="windows"></div>

  <!-- Taskbar -->
  <footer id="taskbar">
    <button id="btn-home">🏠</button>
    <div id="tasks"></div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
