<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Calculadora</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Segoe UI", system-ui, sans-serif;
  background: linear-gradient(160deg, #1a1a1f, #0f0f12);
  color: #fff;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  user-select: none;
}
.calc {
  width: 100%;
  max-width: 340px;
  background: rgba(255,255,255,.04);
  border-radius: 16px;
  padding: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}
.display {
  padding: 20px 16px;
  text-align: right;
  min-height: 100px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  gap: 4px;
  border-radius: 10px;
  background: rgba(0,0,0,.25);
  margin-bottom: 12px;
}
.expr { font-size: 14px; color: rgba(255,255,255,.5); min-height: 18px; word-break: break-all; }
.result {
  font-size: 40px;
  font-weight: 300;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}
button {
  aspect-ratio: 1;
  border: none;
  border-radius: 10px;
  background: rgba(255,255,255,.06);
  color: #fff;
  font-size: 20px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  transition: all .12s;
}
button:hover { background: rgba(255,255,255,.12); }
button:active { transform: scale(.94); }
button.op { background: rgba(76,194,255,.15); color: #4cc2ff; }
button.op:hover { background: rgba(76,194,255,.25); }
button.eq { background: #4cc2ff; color: #000; font-weight: 600; }
button.eq:hover { filter: brightness(1.15); }
button.wide { grid-column: span 2; aspect-ratio: auto; }
</style>
</head>
<body>
<div class="calc">
  <div class="display">
    <div class="expr" id="expr"></div>
    <div class="result" id="result">0</div>
  </div>
  <div class="grid">
    <button class="op" data-act="clear">C</button>
    <button class="op" data-act="del">⌫</button>
    <button class="op" data-val="%">%</button>
    <button class="op" data-val="/">÷</button>

    <button data-val="7">7</button>
    <button data-val="8">8</button>
    <button data-val="9">9</button>
    <button class="op" data-val="*">×</button>

    <button data-val="4">4</button>
    <button data-val="5">5</button>
    <button data-val="6">6</button>
    <button class="op" data-val="-">−</button>

    <button data-val="1">1</button>
    <button data-val="2">2</button>
    <button data-val="3">3</button>
    <button class="op" data-val="+">+</button>

    <button data-val="0">0</button>
    <button data-val=".">.</button>
    <button class="eq wide" data-act="eq">=</button>
  </div>
</div>

<script>
let expr = '';
const $expr = document.getElementById('expr');
const $result = document.getElementById('result');

function update() {
  $expr.textContent = expr;
  try {
    if (!expr) { $result.textContent = '0'; return; }
    const safe = expr.replace(/[^0-9+\-*/.()%]/g, '');
    const val = Function('"use strict"; return (' + safe + ')')();
    $result.textContent = (typeof val === 'number' && isFinite(val))
      ? parseFloat(val.toFixed(10)).toString()
      : '0';
  } catch { $result.textContent = '...'; }
}

document.querySelectorAll('button').forEach(btn => {
  btn.onclick = () => {
    const val = btn.dataset.val;
    const act = btn.dataset.act;

    if (act === 'clear') expr = '';
    else if (act === 'del') expr = expr.slice(0, -1);
    else if (act === 'eq') {
      try {
        const safe = expr.replace(/[^0-9+\-*/.()%]/g, '');
        const val = Function('"use strict"; return (' + safe + ')')();
        expr = parseFloat(val.toFixed(10)).toString();
      } catch { expr = ''; }
    }
    else if (val) expr += val;
    update();
  };
});

// Suporte a teclado
document.addEventListener('keydown', e => {
  if (/[0-9+\-*/.()%]/.test(e.key)) { expr += e.key; update(); }
  else if (e.key === 'Enter' || e.key === '=') {
    try {
      const safe = expr.replace(/[^0-9+\-*/.()%]/g, '');
      const val = Function('"use strict"; return (' + safe + ')')();
      expr = parseFloat(val.toFixed(10)).toString();
    } catch { expr = ''; }
    update();
  }
  else if (e.key === 'Backspace') { expr = expr.slice(0, -1); update(); }
  else if (e.key === 'Escape') { expr = ''; update(); }
});

update();
</script>
</body>
</html>
