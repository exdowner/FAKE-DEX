<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terminal</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Cascadia Code", "Consolas", monospace;
  background: #0a0a0f;
  color: #4cc2ff;
  height: 100vh;
  padding: 16px;
  overflow-y: auto;
  font-size: 13px;
  line-height: 1.5;
}
.line { white-space: pre-wrap; word-break: break-all; }
.prompt { color: #4cc2ff; }
.input-line { display: flex; gap: 8px; }
input {
  flex: 1;
  background: none;
  border: none;
  color: #fff;
  font-family: inherit;
  font-size: inherit;
  outline: none;
}
.err { color: #ff6b6b; }
.ok { color: #51cf66; }
</style>
</head>
<body>
<div id="out"></div>
<div class="input-line">
  <span class="prompt">webdex&gt;</span>
  <input id="cmd" autofocus autocomplete="off" spellcheck="false">
</div>

<script>
const $out = document.getElementById('out');
const $cmd = document.getElementById('cmd');

function print(text, cls = '') {
  const d = document.createElement('div');
  d.className = 'line ' + cls;
  d.textContent = text;
  $out.appendChild(d);
  window.scrollTo(0, document.body.scrollHeight);
}

const commands = {
  help: () => print('Comandos: help, date, echo <txt>, clear, about, color <hex>'),
  date: () => print(new Date().toLocaleString('pt-BR')),
  about: () => print('WebDEX Terminal v1.0 — feito por você 😎'),
  clear: () => $out.innerHTML = '',
  echo: (args) => print(args.join(' ')),
  color: (args) => {
    if (!args[0]) return print('uso: color #ff0000', 'err');
    document.body.style.color = args[0];
    print('ok', 'ok');
  }
};

$cmd.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const raw = $cmd.value.trim();
  $cmd.value = '';
  if (!raw) return;

  print('webdex> ' + raw, 'prompt');
  const [cmd, ...args] = raw.split(' ');

  if (commands[cmd]) commands[cmd](args);
  else print(`comando não encontrado: ${cmd}`, 'err');
});

print('WebDEX Terminal v1.0');
print('Digite "help" para ver os comandos.');
print('');
</script>
</body>
</html>
